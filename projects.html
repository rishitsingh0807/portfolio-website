<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Rishit Singh</title>
  <meta name="description" content="A curated showcase of hardware and optics engineering projects by Rishit Singh.">
  <link rel="stylesheet" href="/css/index.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/projects.css">
</head>
<body>
  <!-- Same navbar as index, but with "works" as active -->
  <nav class="navbar" id="navbar">
    <div class="navbar-center">
      <div class="navbar-glass">
        <a href="/" class="nav-link" data-path="/">home</a>
        <a href="/projects.html" class="nav-link active" data-path="/projects">works</a>
        <a href="/#blog" class="nav-link" data-path="/blog">blog</a>
        <a href="/#about" class="nav-link" data-path="/about">about</a>
      </div>
    </div>
  </nav>

  <main class="projects-page">
    <!-- Section header -->
    <div class="projects-header">
      <div>
        <p class="projects-label">Portfolio</p>
        <h1 class="projects-title">Selected Projects</h1>
      </div>
      <p class="projects-hint">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        Scroll to drive the helix · hover to slow it down
      </p>
    </div>

    <!-- Helix viewport -->
    <div class="helix-viewport" id="helix-viewport">
      <div class="helix-fade helix-fade-top"></div>
      <div class="helix-fade helix-fade-bottom"></div>
      <div class="helix-axis"></div>
      <div class="helix-stage" id="helix-stage">
        <!-- Cards are generated by JS -->
      </div>
    </div>
  </main>

  <!-- Modal (hidden by default, shown by JS) -->
  <div class="project-modal-overlay" id="project-modal" role="dialog" aria-modal="true" hidden>
    <div class="project-modal-backdrop"></div>
    <div class="project-modal-content">
      <button class="project-modal-close" id="modal-close" aria-label="Close project details">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="project-modal-image" id="modal-image"></div>
      <div class="project-modal-body">
        <span class="project-modal-category" id="modal-category"></span>
        <h2 class="project-modal-title" id="modal-title"></h2>
        <p class="project-modal-description" id="modal-description"></p>
      </div>
    </div>
  </div>

  <script type="module" src="/js/projects.js"></script>
</body>
</html>
